; ==========================================================
; RESOURCE LIMITS
; ==========================================================
; Keep this at 128M. It's the safety line for your 512MB server.
memory_limit = 128M

; Kill scripts that stall (e.g., failed backups or imports)
max_execution_time = 60
max_input_time = 60

; Increase this to prevent "Menu Item Loss" when saving large menus.
; 1000 is default. 3000 is safe for low RAM.
max_input_vars = 3000

; ==========================================================
; UPLOADS
; ==========================================================
upload_max_filesize = 16M
post_max_size = 16M

; ==========================================================
; OPCACHE SETTINGS (ALLOWED IN .USER.INI)
; ==========================================================
; 1. Force Enable OPcache for this site
opcache.enable = 1

; 2. THE SPEED SETTING
; 0 = PHP serves from RAM and NEVER checks disk. (Fastest)
; 1 = PHP checks disk for changes. (Slower)
; WARNING: If set to 0, you must clear W3 Total Cache (Page Cache)
; to see changes after updating plugins/themes.
;opcache.validate_timestamps = 0

; If you find "0" too annoying for updates, use these two lines instead:
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; 3. DISABLE JIT (Just-In-Time Compiler)
; PHP 8.3 JIT is great for math, but it eats RAM.
; On 512MB, we want that RAM for WordPress, not the compiler buffer.
opcache.jit = off

; ==========================================================
; SETTINGS THAT WILL NOT WORK (DO NOT ADD THESE)
; ==========================================================
; The following settings are SYSTEM level.
; If you add them here, they are simply ignored.
; You are forced to use whatever your provider set globally.
; opcache.memory_consumption
; opcache.interned_strings_buffer
; opcache.max_accelerated_files